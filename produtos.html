<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bebidas | Black Jack</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container navbar">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
        <img src="logo/logo.png" alt="Logo" style="max-height: 40px;">
        <div>Black<span>Jack</span></div>
      </a>
      <div class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </div>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Início</a>
        <a href="produtos.html" class="active">Bebidas</a>
        <a href="combos.html">Combos</a>
        <a href="carrinho.html" class="cart-icon">
          🛒 Carrinho <span class="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1 class="section-title">Todas as Bebidas</h1>
      
      <div class="filter-bar">
        <div class="category-filters">
          <button class="filter-btn active" data-category="Todos">Todos</button>
          <button class="filter-btn" data-category="Vodka">Vodka</button>
          <button class="filter-btn" data-category="Gin">Gin</button>
          <button class="filter-btn" data-category="Whisky">Whisky</button>
          <button class="filter-btn" data-category="Energético">Energético</button>
          <button class="filter-btn" data-category="Gelo saborizado">Gelo</button>
          <button class="filter-btn" data-category="Cerveja">Cerveja</button>
          <button class="filter-btn" data-category="Bebidas">Outros</button>
        </div>
        
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Buscar por nome ou categoria...">
        </div>
      </div>

      <div id="grid-produtos" class="products-grid">
        <!-- Products injected by JS -->
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-content">
        <h2 class="logo">Black<span>Jack</span></h2><p style="color: #888; margin-top: 10px;">R. Fagundes Varela, 320 - Pioneiros, Pimenta Bueno - RO, 78984-000</p>
      </div>
      <div class="footer-bottom">
        &copy; 2026 Black Jack. Todos os direitos reservados.
      </div>
    </div>
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
