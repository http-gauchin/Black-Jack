<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Black Jack</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="container navbar">
      <a href="index.html" class="logo">Black<span>Jack</span></a>
      <div class="menu-toggle" id="menu-toggle">
        <span></span><span></span><span></span>
      </div>
      <nav class="nav-links" id="nav-links">
        <a href="index.html">Início</a>
        <a href="produtos.html">Bebidas</a>
        <a href="combos.html">Combos</a>
        <a href="carrinho.html" class="cart-icon">
          🛒 Carrinho <span class="cart-count">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section>
      <h1 class="section-title">Finalizar Pedido</h1>
      
      <form id="checkout-form" class="checkout-layout">
        <div class="checkout-form">
          <section>
            <h3>Dados do Cliente</h3>
            <div class="form-grid">
              <div class="form-group full">
                <label>Nome completo</label>
                <input type="text" required placeholder="Ex: João da Silva">
              </div>
              <div class="form-group">
                <label>Telefone / WhatsApp</label>
                <input type="tel" required placeholder="(00) 00000-0000">
              </div>
              <div class="form-group">
                <label>CPF ou CNPJ</label>
                <input type="text" required placeholder="000.000.000-00">
              </div>
            </div>
          </section>

          <section>
            <h3>Endereço de Entrega</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Rua</label>
                <input type="text" required>
              </div>
              <div class="form-group">
                <label>Número</label>
                <input type="text" required>
              </div>
              <div class="form-group">
                <label>Bairro</label>
                <input type="text" required>
              </div>
              <div class="form-group">
                <label>Cidade</label>
                <input type="text" required>
              </div>
              <div class="form-group full">
                <label>Complemento</label>
                <input type="text">
              </div>
              <div class="form-group full">
                <label>Referência</label>
                <input type="text">
              </div>
            </div>
          </section>

          <section>
            <h3>Forma de Pagamento</h3>
            <div class="form-group full">
              <select required>
                <option value="">Selecione...</option>
                <option value="pix">Pix</option>
                <option value="cartao">Cartão de Crédito/Débito</option>
                <option value="dinheiro">Dinheiro na entrega</option>
              </select>
            </div>
          </section>

          <div class="checkbox-group">
            <input type="checkbox" id="agree-18" required>
            <label for="agree-18">Confirmo que tenho 18 anos ou mais.</label>
          </div>

          <button type="submit" class="btn-primary" style="width: 100%; padding: 15px; font-size: 1.2rem;">Concluir Compra</button>
        </div>

        <div>
          <div class="cart-summary" style="top: 20px;">
            <h3>Resumo do Pedido</h3>
            <div id="cart-summary-details">
              <!-- Injected by JS -->
            </div>
          </div>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <div class="container">
      <div class="footer-content">
        <h2 class="logo">Black<span>Jack</span></h2>
      </div>
      <div class="footer-bottom">
        &copy; 2026 Black Jack. Todos os direitos reservados.
      </div>
    </div>
  </footer>

  <script src="js/produtos.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
